  # # FRONTENDS  (Angular + Nginx)

  front-general-service:
    build: ./FrontGeneralService
    image: front-general-service
    container_name: front-general-service
    ports:
      - "4200:80"
    depends_on:
      - gateway-service
    environment:
      GATEWAY_URL: http://localhost:8000
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: pokemon-drafter
      KEYCLOAK_CLIENT_ID: frontend-client
      FRONT_RED_URL: http://localhost:4201
      FRONT_BLUE_URL: http://localhost:4202
    networks:
      - pokemon-net

  front-red-service:
    build: ./FrontColorService
    image: front-red-service
    container_name: front-red-service
    ports:
      - "4201:80"
    depends_on:
      - gateway-service
    environment:
      COLOR: red
      GATEWAY_URL: http://localhost:8000
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: pokemon-drafter
      KEYCLOAK_CLIENT_ID: frontend-client
      FRONT_GENERAL_URL: http://localhost:4200
      CHAT_WS_URL: ws://localhost:8006
    networks:
      - pokemon-net

  front-blue-service:
    build: ./FrontColorService
    image: front-blue-service
    container_name: front-blue-service
    ports:
      - "4202:80"
    depends_on:
      - gateway-service
    environment:
      COLOR: blue
      GATEWAY_URL: http://localhost:8000
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: pokemon-drafter
      KEYCLOAK_CLIENT_ID: frontend-client
      FRONT_GENERAL_URL: http://localhost:4200
      CHAT_WS_URL: ws://localhost:8006
    networks:
      - pokemon-net

  # Mailpit fake SMTP server for keycloak
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - pokemon-net
  #  Volumes
volumes:
  postgres_data:
  redis_data:

    # Network
networks:
  pokemon-net:
    driver: bridge
