services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - microservices-net

  postgres:
    image: postgres:17
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net

  back-blue-service:
    build: ./app/back_blue_service
    ports:
      - "8001:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/blue_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  back-general-service:
    build: ./app/back_general_service
    ports:
      - "8002:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/adminLogs_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  back-red-service:
    build: ./app/back_red_service
    ports:
      - "8003:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/red_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  front-general-service:
    build: ./app/front_general_service
    ports:
      - "8004:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/adminLogs_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  front-blue-service:
    build: ./app/front_blue_service
    ports:
      - "8005:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/blue_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  front-red-service:
    build: ./app/front_red_service
    ports:
      - "8006:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:1234@postgres_db:5432/red_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

  gateway-service:
    build: ./app/gateway_service
    container_name: gateway-service-1
    restart: on-failure
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
