  # # SHARED SERVICES 

  pokemon-service:
    build: ./PokemonService
    image: pokemon-service
    container_name: pokemon-service
    ports:
      - "8003:8000"
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis-cache:6379
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
    networks:
      - pokemon-net

