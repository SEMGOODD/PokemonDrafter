  combat-service:
    build: ./CombatService
    image: combat-service
    container_name: combat-service
    ports:
      - "8005:8000"
    depends_on:
      - kafka
      - postgres
      - pokemon-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POKEMON_SERVICE_URL: http://pokemon-service:8000
      KEYCLOAK_URL: http://keycloak:8080
      DATABASE_URL: jdbc:postgresql://postgres-db:5432/combat_db
      DATABASE_USER: admin
      DATABASE_PASSWORD: 1234
    networks:
      - pokemon-net

  chat-service:
    build: ./ChatService
    image: chat-service
    container_name: chat-service
    ports:
      - "8006:8000"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
