server:
  port: 8000

spring:
  application:
    name: combat-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres-db:5432/combat_db}
    username: ${DATABASE_USER:admin}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/pokemon-drafter/protocol/openid-connect/certs
          issuer-uri: ""

pokemon:
  service:
    url: ${POKEMON_SERVICE_URL:http://pokemon-service:8000}

logs:
  kafka:
    topic: logs-service
    threshold: INFO
