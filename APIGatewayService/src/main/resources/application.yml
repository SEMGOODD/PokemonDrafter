server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: pokemon-route
          uri: ${POKEMON_SERVICE_URL:http://pokemon-service:8000}
          predicates:
            - Path=/api/pokemon/**
          filters:
            - StripPrefix=1

        - id: types-route
          uri: ${POKEMON_SERVICE_URL:http://pokemon-service:8000}
          predicates:
            - Path=/api/types/**
          filters:
            - StripPrefix=1

        - id: combat-route
          uri: ${COMBAT_SERVICE_URL:http://combat-service:8000}
          predicates:
            - Path=/api/combat/**
          filters:
            - StripPrefix=1

        - id: players-route
          uri: ${COMBAT_SERVICE_URL:http://combat-service:8000}
          predicates:
            - Path=/api/players/**
          filters:
            - StripPrefix=1

        - id: teams-route
          uri: ${COMBAT_SERVICE_URL:http://combat-service:8000}
          predicates:
            - Path=/api/teams/**
          filters:
            - StripPrefix=1

        - id: chat-route
          uri: ${CHAT_SERVICE_URL:http://chat-service:8000}
          predicates:
            - Path=/api/chat/**

        - id: logs-route
          uri: ${LOGS_SERVICE_URL:http://logs-service:8000}
          predicates:
            - Path=/api/logs/**
          filters:
            - StripPrefix=1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/pokemon-drafter/protocol/openid-connect/certs

logs:
  kafka:
    topic: logs-service
    threshold: INFO

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM:pokemon-drafter}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}