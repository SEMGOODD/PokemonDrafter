# ============================================================
#  KEYCLOAK  (Identity Provider)
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: pokemon-drafter
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30002

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: pokemon-drafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak_db"
            - name: KC_DB_USERNAME
              value: "admin"
            - name: KC_DB_PASSWORD
              value: "1234"
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: keycloak-realm
          configMap:
            name: keycloak-realm

# ============================================================
#  API GATEWAY  (Spring Boot)
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: pokemon-drafter
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: pokemon-drafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:4200,http://localhost:4201,http://localhost:4202,http://pokemon-drafter.local,http://192.168.49.2:30001,http://192.168.49.2:30003,http://192.168.49.2:30004"
            - name: KEYCLOAK_REALM
              value: "pokemon-drafter"
            - name: KEYCLOAK_ADMIN_USERNAME
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: POKEMON_SERVICE_URL
              value: "http://pokemon-service:8000"
            - name: COMBAT_SERVICE_URL
              value: "http://combat-service:8000"
            - name: CHAT_SERVICE_URL
              value: "http://chat-service:8000"
            - name: LOGS_SERVICE_URL
              value: "http://logs-service:8000"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

# ============================================================
#  POKEMON SERVICE  (Java Spring Boot + Redis Cache)
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: pokemon-service
  namespace: pokemon-drafter
spec:
  type: ClusterIP
  selector:
    app: pokemon-service
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-service
  namespace: pokemon-drafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokemon-service
  template:
    metadata:
      labels:
        app: pokemon-service
    spec:
      containers:
        - name: pokemon-service
          image: pokemon-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "*"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 10

