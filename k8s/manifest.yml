apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: pokemon-drafter
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: pokemon-drafter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          imagePullPolicy: IfNotPresent
          image: gateway-service:latest
          env:
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration"
          ports:
            - containerPort: 8080

