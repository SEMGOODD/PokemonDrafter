    "loginWithEmailAllowed":true,
    "duplicateEmailsAllowed":false,
    "resetPasswordAllowed":true,
    "editUsernameAllowed":false,
    "bruteForceProtected":false,
    "sslRequired":"none",
    "accessTokenLifespan":3600,
    "ssoSessionIdleTimeout":1800,
    "ssoSessionMaxLifespan":36000,
    "roles":{"realm":[{"name":"red_player","description":"Red team player role","composite":false,"clientRole":false},{"name":"blue_player","description":"Blue team player role","composite":false,"clientRole":false},{"name":"admin","description":"Administrator role","composite":false,"clientRole":false}]},"clients":[{"clientId":"gateway-client","name":"API Gateway Client","enabled":true,"clientAuthenticatorType":"client-secret","secret":"gateway-secret-key","redirectUris": ["http://localhost:4200/*","http://localhost:4201/*","http://localhost:4202/*"],"webOrigins": ["http://localhost:4200","http://localhost:4201","http://localhost:4202"],"publicClient":false,"protocol":"openid-connect","standardFlowEnabled":true,"directAccessGrantsEnabled":true,"serviceAccountsEnabled":true,"fullScopeAllowed":true,"defaultClientScopes":["web-origins","acr","profile","roles","email"]},{"clientId":"frontend-client","name":"Frontend Client","enabled":true,"publicClient":true,"redirectUris": ["http://localhost:4200/*","http://localhost:4201/*","http://localhost:4202/*"],"webOrigins": ["http://localhost:4200","http://localhost:4201","http://localhost:4202"],"protocol":"openid-connect","standardFlowEnabled":true,"directAccessGrantsEnabled":true,"fullScopeAllowed":true,"defaultClientScopes":["web-origins","acr","profile","roles","email","openid"]}],"users":[{"username":"red_player1","enabled":true,"emailVerified":true,"firstName":"Red","lastName":"Player1","email":"red_player1@pokemon-drafter.local","credentials":[{"type":"password","value":"password1","temporary":false}],"realmRoles":["red_player","default-roles-pokemon-drafter"]},{"username":"red_player2","enabled":true,"emailVerified":true,"firstName":"Red","lastName":"Player2","email":"red_player2@pokemon-drafter.local","credentials":[{"type":"password","value":"password2","temporary":false}],"realmRoles":["red_player","default-roles-pokemon-drafter"]},{"username":"blue_player1","enabled":true,"emailVerified":true,"firstName":"Blue","lastName":"Player1","email":"blue_player1@pokemon-drafter.local","credentials":[{"type":"password","value":"password1","temporary":false}],"realmRoles":["blue_player","default-roles-pokemon-drafter"]},{"username":"blue_player2","enabled":true,"emailVerified":true,"firstName":"Blue","lastName":"Player2","email":"blue_player2@pokemon-drafter.local","credentials":[{"type":"password","value":"password2","temporary":false}],"realmRoles":["blue_player","default-roles-pokemon-drafter"]},{"username":"admin","enabled":true,"emailVerified":true,"firstName":"Admin","lastName":"User","email":"admin@pokemon-drafter.local","credentials":[{"type":"password","value":"admin","temporary":false}],"realmRoles":["admin","default-roles-pokemon-drafter"]}]}



# ============================================================
#  PERSISTENT VOLUME CLAIMS
# ============================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: pokemon-drafter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: pokemon-drafter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: pokemon-drafter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi


# ============================================================
#  INGRESS
# ============================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokemon-drafter-ingress
  namespace: pokemon-drafter
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: pokemon-drafter.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: front-general-service
            port:
              number: 80
      - path: /red
        pathType: Prefix
        backend:
          service:
            name: front-red-service
            port:
              number: 80
      - path: /blue
        pathType: Prefix
        backend:
          service:
            name: front-blue-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 8000


# ============================================================
#  KAFKA
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: pokemon-drafter
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pokemon-drafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms256m"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc

# ============================================================
#  POSTGRESQL
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pokemon-drafter
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pokemon-drafter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "1234"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql

